<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Contact | Bita Digital Hub</title>

  <meta
    name="description"
    content="Contact Bita Digital Hub to start your weekly reporting workflow."
  />

  <style>
    :root {
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --primary:#0ea5a4;
      --border:#e2e8f0;
      --radius:16px;
      --shadow:0 10px 30px rgba(2,6,23,.08);
      --max-width:1100px;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.7;
    }

    .container {
      max-width:var(--max-width);
      margin:0 auto;
      padding:3rem 1.25rem 4rem;
    }

    .grid {
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:1.5rem;
      margin-top:2.5rem;
    }

    .card {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:1.75rem;
      box-shadow:var(--shadow);
    }

    .row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:1rem;
    }

    input, textarea {
      width:100%;
      padding:.75rem;
      border-radius:10px;
      border:1px solid var(--border);
      margin-top:.25rem;
    }

    textarea { min-height:140px; }

    .btn {
      padding:.8rem 1.2rem;
      border-radius:12px;
      border:none;
      background:var(--primary);
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }
  </style>
</head>

<body>

<main class="container">

  <h1>Start your weekly reporting workflow</h1>
  <p>Tell us what you want to understand from your data.</p>

  <div class="grid">

    <div class="card">
      <h2>Send a request</h2>

      <!-- ✅ FORM START -->
      <form action="https://formspree.io/f/xlgaqlkn">

        <input type="hidden" name="_subject" value="New request from Bita Digital Hub" />

        <div class="row">
          <div>
            <label>Full name</label>
            <input name="name" required />
          </div>

          <div>
            <label>Your email</label>
            <input name="email" type="email" required />
          </div>
        </div>

        <div style="margin-top:1rem;">
          <label>What do you want to track?</label>
          <textarea name="message" required></textarea>
        </div>

        <div style="margin-top:1.25rem;">
          <button class="btn" type="submit">
            Send message
          </button>
        </div>

      </form>
      <!-- ✅ FORM END -->

    </div>

    <div class="card">
      <h2>What happens next</h2>
      <ul>
        <li>We review your message</li>
        <li>We confirm required files</li>
        <li>You get a clear delivery plan</li>
      </ul>
    </div>

  </div>

</main>

</body>
</html>
